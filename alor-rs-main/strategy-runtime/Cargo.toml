[package]
name = "strategy-runtime"
version = "0.1.0"
edition = "2021"

[features]
shadow-oi-http = ["dep:reqwest", "dep:libc"]

[[bin]]
name = "oi_shadow_capture"
path = "src/bin/oi_shadow_capture.rs"
required-features = ["shadow-oi-http"]

[dependencies]
axum = "0.7"
alor-protocol = { path = "../alor-protocol" }
alor-types = { path = "../alor-types" }
anyhow = "1"
chrono = { workspace = true }
csv = "1.3"
libc = { version = "0.2", optional = true }
parking_lot = { workspace = true }
redis = { version = "0.25.4", features = ["tokio-comp"] }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tokio = { workspace = true }
toml = "0.8.19"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
