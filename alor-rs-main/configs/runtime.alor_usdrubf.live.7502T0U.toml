redis_url = "redis://127.0.0.1/"
portfolio = "7502T0U"
exchange = "MOEX"
source = "strategy-runtime"
consumer_group = "strategy-runtime-alor-usdrubf-live-7502T0U"
consumer_name = "auto"
reset_state_on_start = false

[runtime]
trade_mode = "live"
allow_live_orders = true
allow_paper_orders = false
guard_log_interval_ms = 5000
bootstrap_dump = false
still_blocked_log_period_sec = 60
gateway_health_stale_sec = 20
require_gateway_ready = true

[runtime.health]
enabled = true
listen_addr = "127.0.0.1:8091"
expose_metrics = false

[streams]
bars = "md.bars.7502T0U.10m"
orders = "broker.orders.7502T0U"
trades = "broker.trades.7502T0U"
positions = "broker.positions.7502T0U"
commands = "cmd.orders.7502T0U"
acks = "cmd.acks.7502T0U"
snapshots = "broker.snapshots.7502T0U"
health = "events.health"
dlq_prefix = "dlq"
runtime_state = "runtime.state.alor_usdrubf_hybrid_v1.live.usdrubf.7502T0U"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 10000
orders = 5000
trades = 5000
positions = 20000
commands = 5000
acks = 5000
health = 5000
runtime_state = 500

[strategy]
strategy_id = "alor_usdrubf_hybrid_v1"
strategy_kind = "alor_usdrubf_hybrid"
symbol = "USDRUBF"
qty = 1.0
side = "buy"
tick_size = 0.01
session_open_hour = 9
session_open_minute = 0
session_close_hour = 23
session_close_minute = 49
entry_after_open_min = 0
exit_before_close_min = 0
timezone_offset_hours = 3
max_silence_bars_sec = 1200

[trading_periods]
session_start = "09:00:00"
session_end = "23:49:00"
break_start_1 = "14:00:00"
break_end_1 = "14:04:59"
break_start_2 = "18:50:00"
break_end_2 = "19:04:59"
weekends_off = true
timezone_offset_hours = 3

[strategy.alor_usdrubf_hybrid]
mr_min_rel_range = 0.006
mr_max_rel_range = 0.050
mr_k_short = 0.045
mr_take_k_short = 0.16
mr_stop_k_short = 0.43
mr_last_entry_time = "11:40:00"
mr_force_exit_time = "11:50:00"
bo_k = 0.45
bo_stop1_range = 0.51
bo_stop2_range = 0.35
bo_big_move_threshold = 0.020
