redis_url = "redis://127.0.0.1/"
portfolio = "7502MIW"
exchange = "MOEX"
source = "strategy-runtime-ri-author41-42-micro-live07"
consumer_group = "strategy-runtime-ri-author41-42-micro-live07-7502MIW"
consumer_name = "auto"
reset_state_on_start = true

[runtime]
# Live07 migration candidate for the active RIU6 micro contour. Activate only
# after broker-flat/no-working-order checks and with the legacy09 runtime stopped.
trade_mode = "live"
allow_live_orders = true
allow_paper_orders = false
guard_log_interval_ms = 5000
bootstrap_dump = false
still_blocked_log_period_sec = 60
gateway_health_stale_sec = 20
require_gateway_ready = true

[runtime.health]
enabled = true
listen_addr = "127.0.0.1:8094"
expose_metrics = false

[streams]
bars = "md.bars.7502MIW.RIU6.10m"
orders = "broker.orders.7502MIW"
trades = "broker.trades.7502MIW"
positions = "broker.positions.7502MIW"
commands = "cmd.orders.7502MIW.ri_author41_42.micro"
acks = "cmd.acks.7502MIW.ri_author41_42.micro"
snapshots = "broker.snapshots.7502MIW"
health = "events.health.ri_author41_42.live07.7502MIW"
dlq_prefix = "dlq"
runtime_state = "runtime.state.ri_author41_42.micro.live07.7502MIW"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 10000
orders = 5000
trades = 5000
positions = 20000
commands = 5000
acks = 5000
health = 2000
runtime_state = 500

[strategy]
strategy_id = "ri_author41_42.micro.live07.7502MIW"
strategy_kind = "ri_author41_42"
symbol = "RIU6"
qty = 1.0
side = "buy"
tick_size = 10.0
session_open_hour = 7
session_open_minute = 0
session_close_hour = 23
session_close_minute = 49
entry_after_open_min = 0
exit_before_close_min = 0
timezone_offset_hours = 3
max_silence_bars_sec = 1200

[trading_periods]
session_start = "07:00:00"
session_end = "23:49:59"
break_start_1 = "14:00:00"
break_end_1 = "14:04:59"
break_start_2 = "18:50:00"
break_end_2 = "19:04:59"
weekends_off = true
timezone_offset_hours = 3

[strategy.ri_author41_42]
profile_id = "ri_author41_42_primary_combo_cost2"
timeframe = "10m"
mode = "micro_live"
allow_order_emission = true
execution_path = "action_scoped_only"
# Alor bars arrive with shortname `RIU6`, but CWS order placement expects the
# full security symbol from reference data.
order_symbol = "RTS-9.26"
session_start_time = "07:00:00"
session_end_time = "23:49:59"
author41_entry_end_time = "10:00:00"
author41_time_exit = "20:00:00"
author42_exit_time = "23:00:00"
# DSWD/holiday sessions remain in raw gateway history but never enter RI model
# state or become previous-session anchors.
excluded_model_dates = ["2026-06-12", "2026-11-04"]
min_anchor_bars = 92
anchor_first_bar_at_or_before = "07:10:00"
anchor_last_bar_at_or_after = "23:30:00"
# The MOEX early-session schedule began on 2026-07-14. Older complete legacy09
# sessions remain valid Author42 anchors during canonical07 warm-up.
anchor_transition_date = "2026-07-14"
pre_transition_min_anchor_bars = 80
pre_transition_anchor_first_bar_at_or_before = "09:10:00"
pre_transition_anchor_last_bar_at_or_after = "23:30:00"
# Manual between-session roll contract. Runtime validates and logs this policy;
# it does not switch instruments automatically.
actual_expiry_date = "2026-09-17"
roll_target_sessions_before = 1
roll_fallback_sessions_before = 2
decision_journal_path = "/reports/ri_author41_42_7502MIW_RIU6_micro_live07_decisions.jsonl"
decision_journal_append = true

[paper]
enabled = false
output = "stdout"
file_path = "/reports/paper_ri_author41_42_7502MIW_RIU6_micro_live07.jsonl"
trades_csv = "/reports/trades_ri_author41_42_7502MIW_RIU6_micro_live07.csv"
summary_json = "/reports/summary_ri_author41_42_7502MIW_RIU6_micro_live07.json"
append = false

[backtest]
enabled = false
trade_log = "./strategy-runtime/backtest_trades.log"
trades_csv = "./strategy-runtime/backtest_trades.csv"
summary_json = "./strategy-runtime/backtest_summary.json"
append = false

[replay]
enabled = false
bars_csv_path = "./strategy-runtime/ri_author41_42_bars.csv"
reference_trades_csv_path = "./strategy-runtime/ri_author41_42_reference_trades.csv"
output_dir = "./strategy-runtime/replay_out"
price_tolerance = 1e-8
strict_dedup = true
