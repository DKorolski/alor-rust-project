# Example configuration for alor-gateway
# Optional env overrides:
#   DATA_REPORT_PATH=./report.json
BAR_DUMP_PATH="./bars.csv"
portfolio = "7502T0U"
exchange = "MOEX"
instrument_group = "RFUD"
# used for market order routing in CWS (create:market)
symbols = ["IMOEXF"]

tf_sec = 60
from_ts = 0

ws_url = "wss://api.alor.ru/ws"
cws_url = "wss://api.alor.ru/cws"
oauth_url = "https://oauth.alor.ru/refresh"


log_positions_filter = ["IMOEXF"]
log_cash_positions = false
cash_symbols = ["RUB", "SUR"]
log_existing_snapshot_orders = false

skip_history_bars = false # true => disable history backfill entirely
skip_history_positions = false
skip_history_orders = false
split_adjust = true
format = "Simple"
frequency_ms = 250

backoff_initial_ms = 1000
backoff_max_ms = 30000
backoff_multiplier = 2

max_silence_bars_sec = 1200

history_sessions = 5
history_days_back = 5
session_rollover_hour_utc = 6
health_listen_addr = "127.0.0.1:8081"

[trading_periods]
session_start = "09:00:00"
session_end = "23:49:00"
break_start_1 = "14:00:00"
break_end_1 = "14:04:59"
break_start_2 = "18:50:00"
break_end_2 = "19:04:59"
weekends_off = false
timezone_offset_hours = 3


[ws]
ws_idle_timeout_sec = 70
ws_ping_interval_sec = 30
ws_ping_timeout_sec = 15
subscribe_ack_timeout_ms = 5000
subscribe_ack_retries = 3

[reconnect]
warm_reconnect_max_gap_sec = 21600
gap_backfill_padding_bars = 2
cold_start_history_days_back = 5 # set to 0 + history_sessions/history_days_back 0 => NoHistory
bar_silence_resync_min_sec = 1200

[general]
price_step = 0.5
volume_step = 1
