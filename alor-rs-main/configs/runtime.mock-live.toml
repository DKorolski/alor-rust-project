redis_url = "redis://127.0.0.1/"
portfolio = "7502T0U"
exchange = "MOEX"
source = "strategy-runtime"
consumer_group = "strategy-runtime"
consumer_name = "mock-live-probe"
reset_state_on_start = true

[runtime]
trade_mode = "live"
allow_live_orders = true
allow_paper_orders = false
guard_log_interval_ms = 5000
bootstrap_dump = false
still_blocked_log_period_sec = 60
gateway_health_stale_sec = 20
require_gateway_ready = true

[runtime.health]
enabled = true
listen_addr = "127.0.0.1:8092"
expose_metrics = false

[streams]
bars = "md.bars.7502T0U.1m"
orders = "broker.orders.7502T0U"
trades = "broker.trades.7502T0U"
positions = "broker.positions.7502T0U"
commands = "cmd.orders.7502T0U"
acks = "cmd.acks.7502T0U"
snapshots = "broker.snapshots.7502T0U"
health = "events.health"
dlq_prefix = "dlq"
runtime_state = "runtime.state.mock_live_probe.7502T0U"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 200000
orders = 100000
trades = 100000
positions = 50000
commands = 50000
acks = 100000
health = 10000
runtime_state = 2000

[strategy]
# Select mode via strategy_id suffix:
# - mock_live_probe.place_market_once
# - mock_live_probe.place_limit_bad_price
# - mock_live_probe.place_limit_bad_step
# - mock_live_probe.cancel_after_terminal
strategy_id = "mock_live_probe.place_limit_bad_step"
strategy_kind = "mock_live_probe"
symbol = "USDRUBF"
qty = 1.0
side = "buy"
place_offset_ticks = 0
tick_size = 0.01
max_wait_bars_for_ack = 1 # reused by mock_live_probe as trigger_after_live_bars
close_trigger = "next_bar" # unused by mock_live_probe (shared schema)
session_open_hour = 0 # shared schema placeholder
session_open_minute = 0 # shared schema placeholder
session_close_hour = 23 # shared schema placeholder
session_close_minute = 49 # shared schema placeholder
entry_after_open_min = 0 # shared schema placeholder
exit_before_close_min = 0 # shared schema placeholder
timezone_offset_hours = 3 # shared schema placeholder
max_silence_bars_sec = 1200

[trading_periods]
session_start = "09:00:00"
session_end = "23:49:00"
break_start_1 = "14:00:00"
break_end_1 = "14:04:59"
break_start_2 = "18:50:00"
break_end_2 = "19:04:59"
weekends_off = true
timezone_offset_hours = 3

[strategy.session_gap]
# shared schema placeholders (unused by mock_live_probe)
k_long = 0.5
k_short = 0.46
wait_hours = 3
k_tp_short = 0.28
k_sl_short = 0.65
long_ex_pct = 2.2
short_ex_pct = 2.2
k_tp_long = 0.28
k_sl_long = 0.68
start_cash = 30000
cash_factor = 0.9
max_entry_hour = 19
close_hour = 23
close_minute = 49
session_gap_min = 60.0
exit_offset_min = 20
work_weekends = false

[paper]
enabled = false
output = "stdout"
file_path = "./strategy-runtime/paper_trades.jsonl"
trades_csv = "./strategy-runtime/trades.csv"
summary_json = "./strategy-runtime/summary.json"
append = false

[backtest]
enabled = false
trade_log = "./strategy-runtime/backtest_trades.log"
trades_csv = "./strategy-runtime/backtest_trades.csv"
summary_json = "./strategy-runtime/backtest_summary.json"
append = false

[replay]
enabled = false
bars_csv_path = "./paper_bars_2.csv"
reference_trades_csv_path = "./paper_trades_2.csv"
output_dir = "./strategy-runtime/replay_out"
price_tolerance = 1e-8
strict_dedup = true
