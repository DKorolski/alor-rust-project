redis_url = "redis://127.0.0.1/"
portfolio = "7502T0U"
exchange = "MOEX"
source = "strategy-runtime"
consumer_group = "strategy-runtime"
consumer_name = "auto"
reset_state_on_start = true

[runtime]
trade_mode = "paper"
allow_live_orders = false
guard_log_interval_ms = 5000
bootstrap_dump = false

[streams]
bars = "md.bars.7502T0U.1m"
orders = "broker.orders.7502T0U"
trades = "broker.trades.7502T0U"
positions = "broker.positions.7502T0U"
commands = "cmd.orders.7502T0U"
acks = "cmd.acks.7502T0U"
snapshots = "broker.snapshots.7502T0U"
health = "events.health"
dlq_prefix = "dlq"
runtime_state = "runtime.state.session_gap_standalone.paper.7502T0U"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 200000
orders = 100000
trades = 100000
positions = 50000
commands = 50000
acks = 100000
health = 10000
runtime_state = 2000

[strategy]
strategy_id = "session_gap_standalone"
strategy_kind = "session_gap_standalone"
symbol = "USDRUBF"
qty = 1.0
side = "buy"
place_offset_ticks = 0
tick_size = 0.01
max_wait_bars_for_ack = 1 # required by shared schema, unused by session_gap_standalone
close_trigger = "next_bar" # required by shared schema, unused by session_gap_standalone
session_open_hour = 0 # required by shared schema, unused by session_gap_standalone
session_open_minute = 0 # required by shared schema, unused by session_gap_standalone
session_close_hour = 23
session_close_minute = 49
entry_after_open_min = 0 # required by shared schema, unused by session_gap_standalone
exit_before_close_min = 0 # required by shared schema, unused by session_gap_standalone
timezone_offset_hours = 3

[strategy.session_gap]
k_long = 0.5
k_short = 0.46
wait_hours = 3
k_tp_short = 0.28
k_sl_short = 0.65
long_ex_pct = 2.2
short_ex_pct = 2.2
k_tp_long = 0.28
k_sl_long = 0.68
start_cash = 30000
cash_factor = 0.9
max_entry_hour = 19
close_hour = 23
close_minute = 49
session_gap_min = 60.0
exit_offset_min = 20
work_weekends = false

[paper]
enabled = true
output = "stdout"
file_path = "./strategy-runtime/paper_trades.jsonl"
trades_csv = "./strategy-runtime/trades0.csv"
summary_json = "./strategy-runtime/summary0.json"
append = true

[backtest]
enabled = false
trade_log = "./strategy-runtime/backtest_trades.log"
trades_csv = "./strategy-runtime/backtest_trades.csv"
summary_json = "./strategy-runtime/backtest_summary.json"
append = false

[replay]
enabled = false
bars_csv_path = "./paper_bars_2.csv"
reference_trades_csv_path = "./paper_trades_2.csv"
output_dir = "./strategy-runtime/replay_out"
price_tolerance = 1e-8
strict_dedup = true
