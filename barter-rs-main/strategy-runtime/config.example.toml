redis_url = "redis://127.0.0.1/"
portfolio = "7502T0U"
exchange = "MOEX"
source = "strategy-runtime"
consumer_group = "strategy-runtime"
consumer_name = "auto"

[runtime]
trade_mode = "live" # paper | live | backtest
allow_live_orders = true
guard_log_interval_ms = 5000
bootstrap_dump = false

[streams]
bars = "md.bars.7502T0U.1m"
orders = "broker.orders.7502T0U"
trades = "broker.trades.7502T0U"
positions = "broker.positions.7502T0U"
commands = "cmd.orders.7502T0U"
acks = "cmd.acks.7502T0U"
snapshots = "broker.snapshots.7502T0U"
health = "events.health"
dlq_prefix = "dlq"
runtime_state = "runtime.state.limit_cancel.7502T0U"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 200000
orders = 100000
trades = 100000
positions = 50000
commands = 50000
acks = 100000
health = 10000
runtime_state = 2000

[strategy]
strategy_id = "limit_cancel"
strategy_kind = "limit_cancel" # limit_cancel | market_buy_and_close | toy_session_timing | session_gap_standalone
symbol = "USDRUBF"
qty = 1.0
side = "sell"
place_offset_ticks = 4
tick_size = 0.5
max_wait_bars_for_ack = 3
close_trigger = "next_bar" # next_bar | position_update
session_open_hour = 10
session_open_minute = 0
session_close_hour = 23
session_close_minute = 50
entry_after_open_min = 59
exit_before_close_min = 20
timezone_offset_hours = 3

[strategy.session_gap]
k_long = 0.5
k_short = 0.46
wait_hours = 2
k_tp_short = 0.28
k_sl_short = 0.65
long_ex_pct = 2.2
short_ex_pct = 2.2
k_tp_long = 0.28
k_sl_long = 0.68
start_cash = 30000
cash_factor = 0.9
max_entry_hour = 19
close_hour = 23
close_minute = 49
session_gap_min = 60.0
exit_offset_min = 20
work_weekends = false

[paper]
enabled = false
output = "stdout"
file_path = "./paper_trades.jsonl"
trades_csv = "./trades.csv"
summary_json = "./summary.json"
append = false

[backtest]
enabled = false
trade_log = "./backtest_trades.log"
trades_csv = "./trades.csv"
summary_json = "./summary.json"
append = false

[replay]
enabled = false
bars_csv_path = "./paper_bars_2.csv"
reference_trades_csv_path = "./paper_trades_2.csv"
output_dir = "./replay_out"
price_tolerance = 1e-8
strict_dedup = true
