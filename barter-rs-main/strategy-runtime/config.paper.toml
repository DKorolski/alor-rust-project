redis_url = "redis://127.0.0.1/"
portfolio = "7502T0U"
exchange = "MOEX"
source = "strategy-runtime"
consumer_group = "strategy-runtime"
consumer_name = "auto"

[runtime]
trade_mode = "paper" # paper | live | backtest
allow_live_orders = false
guard_log_interval_ms = 5000

[streams]
bars = "md.bars.7502T0U.1m"
orders = "broker.orders.7502T0U"
positions = "broker.positions.7502T0U"
commands = "cmd.orders.7502T0U"
acks = "cmd.acks.7502T0U"
snapshots = "broker.snapshots.7502T0U"
health = "events.health"
dlq_prefix = "dlq"
runtime_state = "runtime.state.limit_cancel.7502T0U"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 200000
orders = 100000
positions = 50000
commands = 50000
acks = 100000
health = 10000
runtime_state = 2000

[strategy]
strategy_id = "limit_cancel"
strategy_kind = "market_buy_and_close" # limit_cancel | market_buy_and_close
symbol = "IMOEXF"
qty = 1.0
side = "buy"
place_offset_ticks = 2
tick_size = 0.5
max_wait_bars_for_ack = 3
close_trigger = "position_update" # next_bar | position_update

[paper]
enabled = true
output = "stdout"
file_path = "./paper_trades.jsonl"
trades_csv = "./trades.csv"
summary_json = "./summary.json"

[backtest]
enabled = false
trade_log = "./backtest_trades.log"
trades_csv = "./trades.csv"
summary_json = "./summary.json"
