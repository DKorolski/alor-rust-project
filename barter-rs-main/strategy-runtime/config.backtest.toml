redis_url = "redis://127.0.0.1/"
portfolio = "7502T0U"
exchange = "MOEX"
source = "strategy-runtime"
consumer_group = "strategy-runtime"
consumer_name = "auto"

[runtime]
trade_mode = "backtest" # paper | live | backtest
allow_live_orders = false
guard_log_interval_ms = 5000
bootstrap_dump = false

[streams]
bars = "md.bars.7502T0U.1m"
orders = "broker.orders.7502T0U"
trades = "broker.trades.7502T0U"
positions = "broker.positions.7502T0U"
commands = "cmd.orders.7502T0U"
acks = "cmd.acks.7502T0U"
snapshots = "broker.snapshots.7502T0U"
health = "events.health"
dlq_prefix = "dlq"
runtime_state = "runtime.state.toy_session_timing.7502T0U"

[read]
block_ms = 500
claim_idle_ms = 5000
claim_batch = 50
poll_interval_ms = 100

[trim]
bars = 200000
orders = 100000
trades = 100000
positions = 50000
commands = 50000
acks = 100000
health = 10000
runtime_state = 2000

[strategy]
strategy_id = "toy_session_timing"
strategy_kind = "toy_session_timing" # limit_cancel | market_buy_and_close | toy_session_timing | session_gap_standalone
symbol = "IMOEXF"
qty = 1.0
side = "buy"
place_offset_ticks = 2
tick_size = 0.5
max_wait_bars_for_ack = 3
close_trigger = "next_bar" # next_bar | position_update
session_open_hour = 10
session_open_minute = 0
session_close_hour = 23
session_close_minute = 50
entry_after_open_min = 59
exit_before_close_min = 20
timezone_offset_hours = 3

[paper]
enabled = false
output = "stdout"
file_path = "./paper_trades.jsonl"
trades_csv = "./trades.csv"
summary_json = "./summary.json"
append = false

[backtest]
enabled = true
trade_log = "./backtest_trades.log"
trades_csv = "./trades.csv"
summary_json = "./summary.json"
append = false
